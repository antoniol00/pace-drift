name: CI

# Run the quality gates on every push and on pull requests.
on:
  push:
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid successive pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"  # the project's minimum (requires-python >=3.11)

      - name: Install dependencies (from uv.lock)
        run: uv sync --dev --frozen

      - name: Lint (ruff)
        run: make lint

      - name: Typecheck (mypy)
        run: make typecheck

      - name: Tests (pytest)
        run: make test
