[project]
name = "driftgan"
version = "0.2.0"
description = "Reproducible concept-drift adaptation experiments on CICIDS2017: HAT + PHT baselines vs GAN-based early augmentation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "river>=0.23,<0.24",
    "torch>=2.7,<2.9",
    "numpy>=2.0",
    "matplotlib>=3.10",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.14",
    "pyyaml>=6",
    "psutil>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driftgan"]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["driftgan"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
