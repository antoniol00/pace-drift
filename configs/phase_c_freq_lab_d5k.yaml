phase: C_freq_lab_d5k
# Label-matched blind clock. Under label delay the count-matched clock (C_freq_d5k)
# learns from far more of the stream than C_early_d5k, whose firings cluster and restart
# windows, so this clock matches its labelled share instead: interval = train_window /
# share. CIC-IDS2017: C_early_d5k learned from 0.3433 of the stream (ten seeds) -> 5000 / 0.3433
# = 14566; CIC-IDS2018 pins its own in its profile's by_phase block.
label_delay: 5000
periodic_adapt_interval: 14566
