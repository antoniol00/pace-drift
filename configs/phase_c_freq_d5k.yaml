phase: C_freq_d5k
# C_freq with labels delayed by 5,000 flows (about 5 minutes of capture at the
# ~1,100 flows per minute of either window): the error tests and the learner wait for labels,
# the monitor does not. See docs/experiments/11-delay-and-linear.md.
# The clock interval below is recalibrated to the delayed *_early arm's fire count.
label_delay: 5000
# Frequency-matched control for C_early. Adapts on a blind periodic clock with
# no drift signal. interval = 12000 over ~1.95M evaluated samples -> ~162
# adaptations, matching C_early's mean fire count (142-171, mean ~161) from the
# full 5-seed run. Isolates adaptation *frequency* from *timing* (anticipation).
periodic_adapt_interval: 12000
