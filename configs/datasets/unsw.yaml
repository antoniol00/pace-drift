# UNSW-NB15 profile (#4 external validity). This CSV is a CICFlowMeter
# re-extraction of UNSW-NB15 (same ~80-feature family as 2017), not the classic
# 49-feature Argus/Bro set; it contributes a genuinely different attack taxonomy
# (Fuzzers, Exploits, Reconnaissance, Generic, DoS, Shellcode, Backdoor,
# Analysis, Worms).
#
# Window chosen by scripts/scan_drift_window.py (bucket=250000): rows 0-500K and
# 1.75M-3.48M are attack-bearing (~4-5%), with a pure-benign desert in between
# (500K-1.5M). The window below (1.75M-3.45M) is the dense second half where all
# 9 attack families burst on a benign background. Note: the attack-type mix is
# fairly stationary across this region, so the drift is mainly benign<->attack
# bursts rather than attack-type turnover (stated as a caveat in the write-up).
dataset: unsw
csv_path: /mnt/AI-DATA-SSD/alara/Data/UNSW-NB15.csv
target_col: Label
benign_label: Benign
drop_cols: ["Flow ID", "Src IP", "Dst IP", "Src Port", "Timestamp"]  # keep Dst Port / Protocol
start_row: 1750000
max_samples: 1700000
n_pretrain: 50000
# monitor calibration (Task 8): 200K C_early smoke with the ported 0.1 threshold
# fired 25 adaptations (14 recon / 11 class), mean anticipation lead ~6.3K samples,
# recon-error spiking 0.5->3.0 at burst onsets -> the 2017 value generalizes here.
# Pinned so ARF_early / SRP_early use the same calibrated monitor on this dataset.
recon_pht_threshold: 0.1
recon_pht_delta: 0.0005
# Blind-clock cadence for the frequency-matched controls (Tier 1). Calibrated per
# learner so each *_freq arm fires as often as the matching *_early arm on THIS
# dataset: 9549 -> 172 fires vs ARF_early's 173; 9857 -> 167 vs SRP_early's 167.
# The phase defaults (11587 / 11505) are the 2017/2018 calibration and give only
# ~142 fires here, which silently de-matches the control — this is exactly how a
# batch of seeds was invalidated on 2026-07-28. Pinned so the flag is never
# needed on the command line.
# C_freq (HAT): 1.65M evaluated samples / 7710 -> 214 fires vs C_early's 213.8.
by_phase:
  C_freq:
    periodic_adapt_interval: 7710
  ARF_freq:
    periodic_adapt_interval: 9549
  SRP_freq:
    periodic_adapt_interval: 9857
