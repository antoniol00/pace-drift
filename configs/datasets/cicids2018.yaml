# CIC-IDS2018 profile (#4 external validity). CICFlowMeter feature family
# (same as 2017); natural bursty drift.
#
# Window chosen by scripts/scan_drift_window.py (bucket=250000): rows 0-1M hold
# only 2 attack types, then a ~7M-row benign desert (rows 1M-8.25M), then a
# diverse attack sequence from ~9.25M-14.75M. The window below (11M-14M) spans
# the richest block: DoS-Hulk, Infilteration, DDOS-HOIC, DDOS-LOIC-UDP, Bot,
# FTP-BruteForce, SSH-Bruteforce arriving in blocks separated by benign -> many
# drift events. The first 50K (DoS-Hulk, ~48% attack) gives a balanced pretrain.
dataset: cicids2018
csv_path: /mnt/AI-DATA-SSD/alara/Data/CIC-IDS2018.csv
target_col: Label
benign_label: Benign
drop_cols: ["Timestamp"]   # no Flow ID / IP columns in 2018; keep Dst Port / Protocol
start_row: 11000000
max_samples: 3000000
n_pretrain: 50000
# monitor calibration (Task 8): 1M C_early smoke with the ported 0.1 threshold
# fired 185 adaptations (72 recon / 113 class), mean anticipation lead ~3.2K
# samples, recon-error spiking to 2.9. Mean local F1 ~0.74 with 448/1147 valid
# windows < 0.9 (dips at the Infiltration/Bot blocks) -> window is drift-rich, not
# a flat ceiling. Pinned so ARF_early / SRP_early share the same calibrated monitor.
recon_pht_threshold: 0.1
recon_pht_delta: 0.0005
# Blind-clock cadence for the frequency-matched controls (Tier 1), pinned for the
# same reason as in the UNSW profile. Here the calibrated values coincide with the
# phase defaults (254 fires vs ARF_early's 253; 256 vs SRP_early's 254), but they
# are stated explicitly so the match is a recorded decision rather than a
# coincidence that a later edit to the phase config could break.
by_phase:
  ARF_freq:
    periodic_adapt_interval: 11587
  SRP_freq:
    periodic_adapt_interval: 11505
