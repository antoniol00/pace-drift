phase: ARF_freq_lab
# Label-matched blind clock. Under label delay the count-matched clock (ARF_freq)
# learns from far more of the stream than ARF_early, whose firings cluster and restart
# windows, so this clock matches its labelled share instead: interval = train_window /
# share. CIC-IDS2017: ARF_early learned from 0.2514 of the stream (ten seeds) -> 5000 / 0.2514
# = 19890; CIC-IDS2018 pins its own in its profile's by_phase block.
periodic_adapt_interval: 19890
