phase: ARF_freq_d5k
# ARF_freq with labels delayed by 5,000 flows (about 5 minutes of capture at the
# ~1,100 flows per minute of either window): the error tests and the learner wait for labels,
# the monitor does not. See docs/experiments/11-delay-and-linear.md.
# The clock interval below is recalibrated to the delayed *_early arm's fire count.
label_delay: 5000
# CIC-IDS2017: 1.95M evaluated samples / 5875 -> 331 fires vs ARF_early_d5k's
# 331.9 (mean over its ten seeds); CIC-IDS2018 pins its own in its profile's by_phase block.
periodic_adapt_interval: 5875
