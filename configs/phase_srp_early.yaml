phase: SRP_early
# Experiment #3c: SOTA ensemble base learner (SRP_early) driven by C_early's proactive
# dual (recon + class) PHT — same AE monitor + calibration as C_early. Learns
# only in triggered windows. Tests whether early detection helps the strongest
# model (vs SRP_early_sched reactive at the same regime).
monitor_type: ae
monitor_interval: 1000
monitor_epochs: 5
monitor_hidden: 32
monitor_latent: 16
monitor_clip: 10.0
recon_pht_delta: 0.0005
recon_pht_threshold: 0.1
recon_pht_min_instances: 10
lead_horizon: 20000
early_augment: false
