phase: SRP_freq
# Frequency-matched control for SRP_early (Tier 1). SRP adapting only in
# triggered train windows on a BLIND periodic clock, count-matched to SRP_early.
# Comparing SRP_early vs SRP_freq isolates adaptation *timing* from *frequency*.
# The value here is the CIC-IDS2017 anchor's (1.95M evaluated samples / 21666
# -> 90 fires vs SRP_early's 90.1 over ten seeds); other datasets pin their own
# in their profile's by_phase block.
periodic_adapt_interval: 21666
