phase: C_early_d3
# External comparator (related work): D3, the canonical *published* unsupervised
# drift detector (Gozuacik et al., "Unsupervised Concept Drift Detection with a
# Discriminative Classifier", CIKM 2019), swapped in for the autoencoder monitor
# at the identical protocol. Its statistic is the AUC of a logistic regression
# separating the reference window from the current one.
#
# PHT_recon calibrated on the cached D3 score series over the full 2017 stream
# (AUC: min 0.402, median 0.554, p90 0.663, max 0.848). A fine threshold sweep
# gives 59 fires at threshold=0.32 / delta=0.0005, matching the autoencoder's 58
# recon fires -> the arms are fire-count matched and only the shift statistic
# differs. See docs/paper/related-work.md and docs/experiments/07-*.md.
monitor_type: d3
monitor_interval: 1000
monitor_clip: 10.0
recon_pht_delta: 0.0005
recon_pht_threshold: 0.32
recon_pht_min_instances: 10
lead_horizon: 20000
